# apex_cell_sim - simulated FlexBase cell (PLC standard task + KUKA + conveyor + chute).
# Same tag names as the real PLC (plc_tags.yaml). Timings are placeholders until the
# real cell is measured during commissioning.

host: 127.0.0.1
port: 44818                 # EtherNet/IP's port number, only to look familiar - this is plain TCP JSON
scan_hz: 20
time_scale: 1.0             # >1 runs the cell faster than real time (headless demos use 10)
transfer_mode: B            # A pusher+chute | B gravity chute (chosen) | C lift-and-locate+tilt tray

timing:                     # seconds (simulated)
  ack_delay: 0.5
  in_position_delay: 1.0
  pick: 6.0                 # KUKA shelf -> conveyor, one part        [TBD measured]
  convey: 4.0               # conveyor to the stop station            [TBD measured]
  release: 0.5              # stop station opens (B)
  drop: 1.0                 # part slides down the chute
  heartbeat: 0.5
  station_hb_timeout: 2.0

faults:                     # fault injection for tests/demos (all off = normal cell)
  no_ack: false
  agv_not_detected: false
  pick_fail_part: null      # e.g. 2 -> the 2nd unit's pick fails
  lost_part: null           # e.g. 3 -> the 3rd unit never reaches the bin (count mismatch)

gazebo:
  spawn_parts: false        # true when running with the Gazebo world (gz CLI must be on PATH)
  world: apex_lab
  bin_xyz: [2.14, 0.0, 0.62]
